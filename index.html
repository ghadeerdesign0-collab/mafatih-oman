<style>

:root{--bg:#f6efe0;--card:#fffcf5;--tx:#2a2118;--mut:#5c4f41;--pri:#0b5f7a;--on-pri:#ffffff;--pri-t:#0b5f7a;--grn:#2f6b3a;--red:#b3162b;--clay:#8a4b2a;--gold:#7d5a0e;--gold-bg:#e8bf5a;--on-gold:#2b1d00;--hgold:#f0cf7a;--bd:#d8c9aa;--sky:#dcecef;--inp:#fffdf8;--okbg:#d9efdc;--okfg:#14391c;--nobg:#fbe3e3;--nofg:#6b1020;--hd1:#0b4f66;--hd2:#0a3b4d;--sh:rgba(60,40,10,.16);--pat:%238a4b2a;--font-h:'Baloo Bhaijaan 2',Tajawal,Tahoma,sans-serif;--font-b:Tajawal,Tahoma,sans-serif;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

*{box-sizing:inherit}html,body{margin:0}

table{border-collapse:collapse;width:100%;font-size:.98rem}th,td{border:1px solid var(--bd);padding:8px 10px;text-align:right}th{background:var(--sky)}
.scroll{overflow-x:auto}.mut{color:var(--mut);font-size:.92rem}
.full{position:fixed;inset:0;z-index:50;background:var(--bg);overflow:auto;padding:16px}
.split{display:flex;gap:10px}.half{flex:1;background:var(--card);border:3px solid var(--gold-bg);border-radius:26px 26px 14px 14px;padding:14px;text-align:center;transition:opacity .45s}.half.dim{opacity:.5;border-color:var(--bd)}.half:not(.dim){box-shadow:0 0 0 3px var(--gold-bg)}.big{font-size:3rem;font-weight:800;color:var(--pri-t);font-family:var(--font-h)}.mid{text-align:center;font-size:1.25rem;margin:8px 0}@media(max-width:640px){.split{flex-direction:column}}
.gcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px;margin-bottom:14px}.gc{background:var(--card);border:1px solid var(--bd);border-top:5px solid var(--gold-bg);border-bottom:3px solid var(--red);border-radius:18px;padding:14px;min-width:0}

.chip{display:inline-block;background:var(--sky);color:var(--tx);border-radius:20px;padding:3px 12px;font-size:.88rem;margin:2px}

/* خريطة العالم */
.mapwrap{border-radius:22px;overflow:hidden;border:2px solid var(--bd);background:var(--sky)}

.display header,.display .dock,.display nav,.display #sbar{display:none!important}
.display main{max-width:none;padding:12px 0}.display .q{font-size:clamp(34px,4.4vw,64px)}.display .opt{font-size:clamp(24px,2.6vw,40px);min-height:72px;cursor:default}.display .gate b{font-size:1.6rem}.display body,body.display{cursor:pointer}
.wait{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;min-height:80vh;gap:8px}.wait h1{font-size:clamp(34px,5vw,72px);margin:0}

.sub{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 14px}.sub button{min-height:48px;border:2px solid var(--bd);background:var(--card);color:var(--tx);border-radius:999px;padding:6px 18px;font:inherit;font-weight:700;cursor:pointer}.sub button.on{background:var(--pri);color:var(--on-pri);border-color:var(--pri)}
.more{border-style:dashed}

.half .qimg{max-height:30vh}.display .qimg{max-height:52vh}.display .half .qimg{max-height:40vh}
.qthumb{display:block;max-width:160px;max-height:110px;object-fit:contain;border:2px solid var(--bd);border-radius:10px;background:#fff;margin:4px 0}
.evlog{font-size:.9rem;color:var(--mut);margin:6px 0 0;padding-inline-start:20px}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.rm *{transition:none!important;animation:none!important}
.jcs{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px;margin-bottom:8px}
.jc{text-align:start;border:2px solid var(--bd);background:var(--card);color:var(--tx);border-radius:14px;padding:10px;font:inherit;cursor:pointer;display:flex;flex-direction:column;gap:6px;min-height:84px}
.jc.on{border-color:var(--pri);box-shadow:0 0 0 3px var(--pri)}
.ovl{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;padding:16px}.ovl>.card{max-width:560px;width:100%;max-height:90vh;overflow:auto;margin:0}
.flt{border:1px solid var(--bd);border-radius:14px;padding:8px 12px;margin:10px 0}.flt .fr{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:5px 0}.flt .fr>b{flex:0 0 58px}.flt .btn{min-height:38px;padding:4px 12px;font-size:.95em}.flt .fcnt{margin:6px 0 0;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.sbtn{min-height:34px;padding:2px 10px;font-size:.9em}
.conn{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:8px;font-weight:700}
.stgs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}.stg{display:inline-flex;gap:4px}
[hidden]{display:none!important}
#foot{text-align:center;font-size:.8rem;color:var(--mut);padding:10px 12px 14px}
body.display #foot{font-size:.72rem;opacity:.85}
.stp{display:inline-flex;align-items:center;gap:6px;direction:ltr}
.stp .sb{min-width:44px;min-height:44px;padding:0;font-size:1.4rem;font-weight:800;border-radius:12px;border:2px solid var(--pri);background:var(--card);color:var(--tx);cursor:pointer;line-height:1}

.grs{display:flex;gap:6px;flex-wrap:wrap}
.grs button{min-height:44px;padding:6px 14px;border-radius:12px;border:2px solid var(--pri);background:var(--card);color:var(--tx);font:inherit;font-weight:700;cursor:pointer}
.grs button[aria-pressed="true"]{background:var(--pri);color:var(--on-pri)}
.qrow{display:block}.qrow.has{display:grid;grid-template-columns:minmax(0,1fr) minmax(150px,38%);gap:16px;align-items:start}.qrow .q{margin:6px 0}.qpic{text-align:center}.qzoom{border:0;background:none;padding:0;cursor:zoom-in;display:block;width:100%}.qzoom .qimg{width:100%;max-height:320px;object-fit:contain;border-radius:12px;border:2px solid var(--bd)}
body.display .qrow.has{grid-template-columns:minmax(0,1fr) minmax(260px,52%)}body.display .qzoom .qimg{max-height:60vh}
@media(max-width:640px){.qrow.has{grid-template-columns:1fr}.qrow.has .qpic{order:-1}.qzoom .qimg{max-height:240px}}
.stn{margin:6px 0;font-weight:800;color:var(--pri)}.qbox{margin-top:10px}
.unit{align-self:center;font-weight:800;font-size:1.1rem;padding:0 6px}
.htag{font-size:.82rem;opacity:.9;margin:0}
.jcw{position:relative;display:flex;flex-direction:column}.jcw .jc{flex:1}.pinb{position:absolute;top:6px;inset-inline-start:6px;border:0;background:rgba(255,255,255,.85);color:#7d5a0e;font-size:1.25rem;border-radius:50%;width:36px;height:36px;cursor:pointer;line-height:1;padding:0;min-height:0}.pinb.on{background:#fff3c4}.pinw{display:flex;flex-direction:column;gap:4px}.pnote{font-size:.85rem;padding:6px 8px}
.fx svg{overflow:visible}.fxp{transform-box:fill-box;transform-origin:50% 100%}
.fxd{animation:fxdrop .85s cubic-bezier(.3,1.3,.5,1) both}.fxs{animation:fxpop .9s ease-out both}
@keyframes fxdrop{0%{transform:translateY(-34px);opacity:0}70%{opacity:1}100%{transform:none;opacity:1}}
@keyframes fxpop{0%{transform:scale(.6);opacity:0}60%{transform:scale(1.15);opacity:1}100%{transform:none}}
.display .fx svg{width:min(30vw,280px);height:auto}.display .fx-flag svg{width:min(20vw,150px)}.shp{transition:transform .9s cubic-bezier(.3,.8,.3,1)}
.tcw{display:inline-block;min-width:96px;text-align:center;padding:6px 12px;border-radius:12px;font-weight:800}
[style*="--tc"].half{border-top:6px solid var(--tc)}
[style*="--tc"] .tcn{background:var(--tc);color:var(--tci);padding:2px 10px;border-radius:10px;display:inline-block}
.gate[style*="--tc"]{border-top:8px solid var(--tc)}.gate .bar i{background:var(--tc,var(--grn))}
.mh{transform-origin:50% 100%}.mp-celebrate{animation:mhhop 1.1s ease-in-out infinite}.mp-encourage{animation:mhhop 1.8s ease-in-out 1}.mp-think{animation:mhshk .9s ease-in-out 1}
@keyframes mhhop{0%,100%{transform:translateY(0)}40%{transform:translateY(-12px)}}@keyframes mhshk{0%,100%{transform:rotate(0)}25%{transform:rotate(-4deg)}75%{transform:rotate(4deg)}}
.thm{display:block;background:var(--card);border:2px solid var(--bd);border-radius:12px}
.ntc{max-width:1100px;margin:6px auto 0;padding:0 16px}.ntcb{background:var(--gold-bg);border:2px solid var(--bd);border-radius:14px;padding:8px 12px;margin:6px 0;font-size:.92rem}
/* ===== الإصدار ٢٥: شاشة الطلاب بشاشة واحدة (١٦:٩) ===== */
html.dispx{overflow:hidden;height:100%}
body.display{overflow:hidden;padding:0;height:100vh;background:var(--bg)}
body.display main{padding:0;max-width:none;margin:0}

.dsp *{box-sizing:border-box}

.xpan{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);width:min(860px,94vw);z-index:70;background:var(--card);border:2px solid var(--gold,#e8bf5a);border-radius:16px;padding:10px 14px;box-shadow:0 8px 30px rgba(0,0,0,.45);max-height:62vh;overflow:auto}

body.display{--fh:clamp(13px,2.2vh,20px)}

/* ===== الإصدار ٢٧: الأرقام والاتجاه (دالة مركزية) =====
   القاعدة: النص عربي من اليمين، والأرقام تُكتب من اليسار (الخانة الكبرى يسارًا) داخل عنصر معزول الاتجاه.
   N(v)  : نص أرقام شرقية عربية (٠–٩) بفاصلة عشرية «٫» وعلامة سالب «−» — لا HTML.
   NH(v) : الرقم نفسه داخل <bdi dir="ltr" class="n"> — يُستعمل في كل واجهة. لا يُبنى أي رقم حرفًا حرفًا. */
function N(v){return String(v==null?'':v).replace(/\d/g,d=>'٠١٢٣٤٥٦٧٨٩'[d]).replace(/([٠-٩])\.(?=[٠-٩])/g,'$1٫').replace(/(^|[\s(])-(?=[٠-٩])/g,'$1−')}
function NH(v){return '<bdi dir="ltr" class="n">'+N(v)+'</bdi>'}
function NSG(v){v=+v;return (v>0?'+':'')+N(v)}
/* هل الإجابة كلها أرقام وفواصل؟ (تُعرض خاناتها من اليسار) */
function isNumStr(s){s=String(s==null?'':s).replace(/[\sـ]/g,'');return s!==''&&/[0-9٠-٩۰-۹]/.test(s)&&/^[+\-−0-9٠-٩۰-۹٫٬.,،\/:%٪]+$/.test(s)}
function isoNums(root){if(!root||typeof document==='undefined'||!document.createTreeWalker)return 0;let c=0;const L=[];
 if(root.nodeType===3)L.push(root);else{const W=document.createTreeWalker(root,4,null);for(let n;(n=W.nextNode());)L.push(n)}
 for(const t of L){const v=t.nodeValue;if(!v||!/[٠-٩]/.test(v))continue;const p=t.parentNode;if(!p||p.nodeType!==1)continue;
  if(p.closest&&p.closest('bdi.n,script,style,textarea,input,option,[data-noiso]'))continue;
  NUMRE.lastIndex=0;let m,last=0,k=0;const f=document.createDocumentFragment();
  while((m=NUMRE.exec(v))){if(m.index>last)f.appendChild(document.createTextNode(v.slice(last,m.index)));const b=document.createElement('bdi');b.className='n';b.setAttribute('dir','ltr');b.textContent=m[0].replace(/^-/,'−');f.appendChild(b);last=m.index+m[0].length;k++}
  if(!k)continue;if(last<v.length)f.appendChild(document.createTextNode(v.slice(last)));p.replaceChild(f,t);c+=k}
 return c}
